<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PVP Sound 语音试听</title>
  <style>
    :root {
      --gold: #c9a227;
      --gold2: #ffd100;
      --gold-dim: #8a7320;
      --panel: #0d0c0a;
      --inset: #14120e;
      --row: #1a1814;
      --text: #ffd100;
      --muted: #9a9080;
      --white: #f4efe4;
      --green: #1eff00;
      --red: #ff4d4d;
      --tab: #2a2418;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, #2a2214 0%, transparent 55%),
        #070605;
      color: var(--white);
    }
    .shell {
      max-width: 1180px;
      margin: 18px auto 88px;
      background: linear-gradient(#1c1913, #12100c);
      border: 2px solid var(--gold);
      box-shadow: 0 0 0 1px #5a4a20, 0 18px 48px rgba(0,0,0,.55);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid #3d3420;
      background: linear-gradient(#2b2418, #16130e);
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--gold2);
      letter-spacing: .04em;
    }
    .hint { color: var(--muted); font-size: 12px; }
    .tabs {
      display: flex;
      gap: 4px;
      padding: 10px 12px 0;
      background: #100e0b;
    }
    .tab {
      appearance: none;
      border: 1px solid #5a4a20;
      background: var(--tab);
      color: var(--gold2);
      padding: 7px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .tab.active {
      background: #3a3018;
      border-color: var(--gold2);
      box-shadow: inset 0 0 0 1px #6b5428;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px 16px;
      padding: 12px 16px;
      border-bottom: 1px solid #3d3420;
      align-items: end;
    }
    .field label {
      display: block;
      color: var(--gold2);
      font-size: 13px;
      margin-bottom: 6px;
    }
    .packs { display: flex; flex-wrap: wrap; gap: 6px; }
    .pack {
      appearance: none;
      border: 1px solid #5a4a20;
      background: #1a1712;
      color: #e6d9a8;
      padding: 5px 10px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .pack.active {
      background: #3d3010;
      border-color: var(--gold2);
      color: #fff;
    }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; }
    input[type="search"], select, .btn {
      font: inherit;
      font-size: 13px;
    }
    input[type="search"] {
      width: 220px;
      background: #0b0a08;
      border: 1px solid #5a4a20;
      color: var(--white);
      padding: 6px 10px;
    }
    select {
      background: #0b0a08;
      border: 1px solid var(--gold);
      color: var(--gold2);
      padding: 6px 10px;
      min-width: 160px;
    }
    .btn {
      background: linear-gradient(#3a3018, #241c10);
      border: 1px solid var(--gold);
      color: var(--gold2);
      padding: 6px 12px;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(1.15); }
    .intro {
      padding: 8px 16px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .section-title {
      margin: 16px 16px 8px;
      padding: 4px 0 6px;
      border-bottom: 1px solid #5a4a20;
      color: var(--gold2);
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 28px;
      padding: 0 16px 16px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      background: var(--row);
      border: 1px solid transparent;
      cursor: pointer;
      min-height: 32px;
    }
    .row:hover { border-color: var(--gold); background: #241e14; }
    .row.playing {
      border-color: var(--gold2);
      background: #3a2c10;
    }
    .row.missing { opacity: .45; }
    .box {
      width: 16px; height: 16px;
      border: 2px solid var(--gold);
      background: #0b0a08;
      display: grid;
      place-items: center;
      flex: 0 0 16px;
      color: var(--green);
      font-size: 13px;
      line-height: 1;
    }
    .icon {
      width: 20px; height: 20px;
      border-radius: 2px;
      background: #3a2a18;
      flex: 0 0 20px;
      object-fit: cover;
    }
    .name { color: var(--gold2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .player {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: #100e0b;
      border-top: 2px solid var(--gold);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }
    .now { min-width: 280px; }
    .now b { color: var(--gold2); }
    .now span { color: var(--muted); font-size: 12px; }
    audio { display: none; }
    .transport { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
    .play-btn {
      width: 36px; height: 36px; flex: 0 0 36px;
      border: 1px solid var(--gold);
      background: #3a3018;
      color: var(--gold2);
      font-size: 16px;
      cursor: pointer;
    }
    .play-btn:disabled { opacity: .4; cursor: default; }
    .scrub {
      flex: 1; height: 8px; background: #2a2418;
      border: 1px solid #5a4a20; cursor: pointer; position: relative;
    }
    .scrub > i {
      display: block; height: 100%; width: 0;
      background: var(--gold2);
    }
    .time { color: var(--gold2); font-size: 13px; white-space: nowrap; min-width: 90px; }
    .empty { padding: 24px 16px; color: var(--muted); }
    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>PVP Sound — 语音试听</h1>
        <div class="hint">仿设置页技能列表。点技能名播放当前语音包；点勾选也会播。本页只读，不改游戏设置。</div>
      </div>
      <div class="hint" id="stats"></div>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="toolbar">
      <div class="field">
        <label>语音包选择</label>
        <div class="packs" id="packs"></div>
      </div>
      <div class="tools">
        <input type="search" id="q" placeholder="搜索技能 / 文件名 / ID" />
        <select id="classSel" hidden></select>
        <button class="btn" id="playPage" type="button">本页连播</button>
        <button class="btn" id="stop" type="button">停止</button>
      </div>
    </div>
    <div class="intro" id="intro"></div>
    <div id="body"></div>
  </div>
  <div class="player">
    <div class="now" id="now">未播放</div>
    <div class="transport">
      <button class="play-btn" id="playBtn" type="button" disabled>▶</button>
      <div class="scrub" id="scrub"><i id="prog"></i></div>
      <span class="time" id="time">0.00 / 0.00</span>
    </div>
    <audio id="audio"></audio>
  </div>
  <script>
    const audio = document.getElementById("audio");
    const bodyEl = document.getElementById("body");
    const nowEl = document.getElementById("now");
    const playBtn = document.getElementById("playBtn");
    const progEl = document.getElementById("prog");
    const timeEl = document.getElementById("time");
    let data = null;
    let pack = "";
    let tab = "GeneralSpells";
    let classKey = "";
    let queue = [];
    let playingFile = "";

    const TAB_DEFS = [
      { id: "GeneralSpells", title: "通用技能" },
      { id: "ClassSpells", title: "职业技能" },
      { id: "Other", title: "其他语音" },
    ];

    function packUrl(file) {
      return "/media/" + encodeURIComponent(pack) + "/" + encodeURIComponent(file);
    }

    function fmt(t) {
      if (!isFinite(t) || t < 0) return "0.00";
      return t.toFixed(2);
    }

    function syncTransport() {
      const d = audio.duration;
      const c = audio.currentTime || 0;
      timeEl.textContent = `${fmt(c)} / ${fmt(d)}`;
      progEl.style.width = (d > 0 ? (c / d) * 100 : 0) + "%";
      playBtn.disabled = !audio.src || !!audio.error;
      playBtn.textContent = audio.paused ? "▶" : "❚❚";
    }

    function currentClass() {
      if (!data) return null;
      if (tab === "GeneralSpells") return data.classes.find(c => c.key === "General");
      if (tab === "Other") return data.classes.find(c => c.key === "Other");
      return data.classes.find(c => c.key === classKey) || data.classes.find(c => c.key !== "General" && c.key !== "Other");
    }

    function matchSpell(s, q) {
      if (!q) return true;
      const hay = [s.name, s.en, s.file, String(s.id), ...(s.ids || [])].join(" ").toLowerCase();
      return hay.includes(q);
    }

    function filteredGroups(cls) {
      const q = document.getElementById("q").value.trim().toLowerCase();
      if (!cls) return [];
      return cls.groups.map(g => ({
        ...g,
        spells: g.spells.filter(s => matchSpell(s, q)),
      })).filter(g => g.spells.length);
    }

    function searchAllGroups(q) {
      const out = [];
      for (const cls of data.classes) {
        const spells = cls.groups.flatMap(g => g.spells).filter(s => matchSpell(s, q));
        if (spells.length) out.push({ title: cls.zh, spells });
      }
      return out;
    }

    function playSpell(spell, { enqueue } = {}) {
      if (!spell) return;
      if (spell.missing && spell.missing.includes(pack)) {
        nowEl.innerHTML = `<b>${spell.name}</b><br><span style="color:#ff4d4d">当前语音包没有 ${spell.file}</span>`;
        return;
      }
      playingFile = spell.file;
      const packLabel = (data.packs.find(p => p.id === pack) || {}).label || pack;
      const meta = `${packLabel} · ${spell.file}${spell.id ? " · SpellID " + spell.id : ""}`;
      nowEl.innerHTML = `<b>${spell.name}</b><br><span>${meta}</span>`;
      audio.onerror = () => {
        nowEl.innerHTML = `<b>${spell.name}</b><br><span style="color:#ff4d4d">音频加载失败：${packUrl(spell.file)}</span>`;
        syncTransport();
      };
      audio.src = packUrl(spell.file);
      audio.load();
      const p = audio.play();
      if (p) p.catch(() => {});
      syncTransport();
      document.querySelectorAll(".row").forEach(el => {
        el.classList.toggle("playing", el.dataset.file === spell.file);
      });
      if (!enqueue) queue = [];
    }

    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const cls = currentClass();
      const groups = q ? searchAllGroups(q) : filteredGroups(cls);
      const intro = q
        ? `搜索「${document.getElementById("q").value.trim()}」— 点技能名试听当前语音包。`
        : tab === "GeneralSpells"
        ? "播放 debuff / 通用增益语音，如制裁、风暴之锤、破胆怒吼、死亡印记等。点技能名即可试听。"
        : tab === "ClassSpells"
          ? `${cls ? cls.zh : ""} — 点技能名试听当前语音包。`
          : "目录里有、但设置页没单独列出的文件（结束音、打断、治疗被控等）。";
      document.getElementById("intro").textContent = intro;
      document.getElementById("classSel").hidden = tab !== "ClassSpells" || !!q;

      if (!groups.length) {
        bodyEl.innerHTML = `<div class="empty">没有匹配的技能。</div>`;
        return;
      }
      bodyEl.innerHTML = groups.map(g => `
        <div class="section-title">${g.title}</div>
        <div class="grid">
          ${g.spells.map(s => {
            const miss = s.missing && s.missing.includes(pack);
            const icon = s.icon
              ? `<img class="icon" src="${s.icon}" alt="" />`
              : `<span class="icon"></span>`;
            return `<div class="row${miss ? " missing" : ""}${playingFile === s.file ? " playing" : ""}" role="button" tabindex="0" data-file="${s.file}">
              <span class="box">✓</span>
              ${icon}
              <span class="name">${s.name}</span>
              <span class="meta">${miss ? "缺文件" : s.file.replace(/\.ogg$/i,"")}</span>
            </div>`;
          }).join("")}
        </div>
      `).join("");

      const byFile = {};
      groups.forEach(g => g.spells.forEach(s => { byFile[s.file] = s; }));
      bodyEl.querySelectorAll(".row").forEach(el => {
        const go = () => playSpell(byFile[el.dataset.file]);
        el.addEventListener("click", go);
        el.addEventListener("keydown", ev => {
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); }
        });
      });
    }

    function visibleSpells() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const groups = q ? searchAllGroups(q) : filteredGroups(currentClass());
      return groups.flatMap(g => g.spells);
    }

    document.getElementById("playPage").addEventListener("click", () => {
      queue = visibleSpells().filter(s => !(s.missing && s.missing.includes(pack)));
      if (!queue.length) return;
      playSpell(queue.shift(), { enqueue: true });
    });
    document.getElementById("stop").addEventListener("click", () => {
      queue = [];
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      playingFile = "";
      nowEl.textContent = "未播放";
      document.querySelectorAll(".row.playing").forEach(el => el.classList.remove("playing"));
      syncTransport();
    });
    playBtn.addEventListener("click", () => {
      if (!audio.src) return;
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    });
    document.getElementById("scrub").addEventListener("click", ev => {
      const d = audio.duration;
      if (!d) return;
      const rect = ev.currentTarget.getBoundingClientRect();
      audio.currentTime = ((ev.clientX - rect.left) / rect.width) * d;
    });
    audio.addEventListener("timeupdate", syncTransport);
    audio.addEventListener("loadedmetadata", syncTransport);
    audio.addEventListener("play", syncTransport);
    audio.addEventListener("pause", syncTransport);
    audio.addEventListener("ended", () => {
      syncTransport();
      if (queue.length) playSpell(queue.shift(), { enqueue: true });
    });
    document.getElementById("q").addEventListener("input", render);
    document.getElementById("classSel").addEventListener("change", e => {
      classKey = e.target.value;
      render();
    });

    fetch("/api/data").then(r => r.json()).then(d => {
      data = d;
      pack = (d.packs.find(p => p.id === "晓晓1.25x") || d.packs[0] || {}).id;
      const classOpts = d.classes.filter(c => c.key !== "General" && c.key !== "Other");
      classKey = classOpts[0] ? classOpts[0].key : "";
      const sel = document.getElementById("classSel");
      sel.innerHTML = classOpts.map(c => `<option value="${c.key}">${c.zh}</option>`).join("");
      document.getElementById("packs").innerHTML = d.packs.map(p =>
        `<button class="pack${p.id === pack ? " active" : ""}" type="button" data-id="${p.id}">${p.label}</button>`
      ).join("");
      document.getElementById("packs").addEventListener("click", e => {
        const btn = e.target.closest(".pack");
        if (!btn) return;
        pack = btn.dataset.id;
        document.querySelectorAll(".pack").forEach(b => b.classList.toggle("active", b === btn));
        if (playingFile) {
          audio.src = packUrl(playingFile);
          audio.load();
          audio.play().catch(() => {});
        }
        render();
      });
      document.getElementById("tabs").innerHTML = TAB_DEFS.map(t =>
        `<button class="tab${t.id === tab ? " active" : ""}" type="button" data-id="${t.id}">${t.title}</button>`
      ).join("");
      document.getElementById("tabs").addEventListener("click", e => {
        const btn = e.target.closest(".tab");
        if (!btn) return;
        tab = btn.dataset.id;
        document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
        render();
      });
      const n = d.classes.reduce((a, c) => a + c.groups.reduce((b, g) => b + g.spells.length, 0), 0);
      document.getElementById("stats").textContent = `${d.packs.length} 个语音包 · ${n} 条技能`;
      render();
    }).catch(err => {
      bodyEl.innerHTML = `<div class="empty">加载失败。请用「试听语音.bat」或 python serve.py 启动，不要直接双击打开 HTML。<br>${err}</div>`;
    });
  </script>
</body>
</html>
